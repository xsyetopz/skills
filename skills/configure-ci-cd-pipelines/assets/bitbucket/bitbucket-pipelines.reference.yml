# Reference only. Replace image, commands, caches, and deployment controls
# after inspecting the target repository and workspace policy.
image: "<approved-build-image>:<immutable-tag>"

options:
  max-time: 30

pipelines:
  pull-requests:
    "**":
      - step:
          name: Build and test
          script:
            - ./ci/bootstrap
            - ./ci/build
            - ./ci/test
          artifacts:
            - artifacts/diagnostics/**

  branches:
    main:
      - step:
          name: Verify main
          script:
            - ./ci/bootstrap
            - ./ci/build
            - ./ci/test
