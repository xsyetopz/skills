# Reference only. Replace commands, runner labels, and action versions after
# inspecting the target repository and organization policy.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bootstrap with the repository command
        run: ./ci/bootstrap

      - name: Build
        run: ./ci/build

      - name: Test
        run: ./ci/test

      - name: Upload diagnostic output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: artifacts/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
