stages: [test, deploy]

default:
  image: python:3.13

test:
  stage: test
  script:
    - python3 -m unittest discover -s tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  script:
    - ./ci/deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
