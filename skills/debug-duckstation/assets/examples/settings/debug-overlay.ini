; Keys to change in a portable settings.ini for a diagnostic run.
; Section and key names match the settings.ini written by release
; v0.1-11826; merge them into that file while DuckStation is not running.
[Logging]
LogLevel = Debug
LogToFile = true
LogFileTimestamps = true
LogToConsole = false

[Debug]
EnableGDBServer = true
GDBServerPort = 2345

[Main]
SaveStateOnExit = false
