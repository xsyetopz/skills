[package]
name = "rust-optimization-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "pairs"
path = "comparisons/src/lib.rs"

[[bin]]
name = "pairs-cli"
path = "comparisons/src/main.rs"

[[bin]]
name = "semantics"
path = "correctness/semantics.rs"

[[test]]
name = "pairs"
path = "comparisons/tests/pairs.rs"

[profile.release]
opt-level = 3
# Preserve checked arithmetic as this fixture's explicit contract in all builds.
overflow-checks = true

[profile.experiment-o2]
inherits = "release"
opt-level = 2

[profile.experiment-thin]
inherits = "release"
lto = "thin"

[profile.experiment-cgu1]
inherits = "release"
codegen-units = 1

[profile.experiment-lto-off]
inherits = "release"
lto = "off"
